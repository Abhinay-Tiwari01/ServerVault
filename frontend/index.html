<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/PSMLOGO.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./Assets/PSMLOGO.PNG">
    <link rel="apple-touch-icon" href="./Assets/PSMLOGO.PNG">
    <title>ServerVault</title>
    <!-- <meta http-equiv="refresh" content="0; url=FORMS/LoginPage/LoginAndCreatePage.html"> -->
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-light: #1e1e1e;
            --accent: #00b5e2;
            --accent-hover: #0098c2;
            --text-light: #f0f0f0;
            --border: #333;
            --danger: #e74c3c;
            --success: #2ecc71;
            --premium-gradient: linear-gradient(135deg, #7edff7 0%, #7c3ee9 50%, #79254a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(39, 149, 177, 0.74) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(129, 81, 211, 0.521) 0%, transparent 50%);
            color: var(--text-light);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: var(--premium-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 181, 226, 0.3);
            animation: fadeInUp 0.8s ease-out;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
        }

        .login-link {
            background: var(--bg-light);
            color: var(--text-light);
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: 500;
            animation: fadeInUp 1s ease-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .login-link:hover {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 181, 226, 0.4);
        }

        .login-text {
            margin-bottom: 1rem;
            opacity: 0.7;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">PSM SERVERVAULT</h1>
        <!-- <p class="login-text">If you are not redirected automatically,</p> -->
        <a href="FORMS/LoginPage/LoginAndCreatePage.html" class="login-link">click here to login</a>
    </div>
</body>
</html>
