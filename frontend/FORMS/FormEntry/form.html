<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Data Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/CSS/FormCss/formStyle.css" />
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="form-shell" id="formShell">

    <!-- Header -->
    <div class="form-header">
      <div class="header-left">
        <div class="brand-mark">
          <div class="brand-dot">P</div>
          <span class="brand-name">PSM ServerVault</span>
        </div>
        <div class="header-divider"></div>
        <h2 class="form-title" id="formHeading">Company Payment Entry</h2>
      </div>
      <a href="/FORMS/FormEntry/menu.html" class="btn-back">
        ← Back to List
      </a>
    </div>

    <!-- Card -->
    <div class="form-card">

      <!-- Top accent line -->
      <div class="card-accent"></div>

      <form id="data-form" novalidate>

        <!-- Hidden ID -->
        <input type="hidden" name="id" id="recordId" />

        <!-- Grid layout -->
        <div class="form-grid">

          <div class="field-group full-width">
            <label class="field-label">Company Name <span class="required">*</span></label>
            <input type="text" class="field-input" placeholder="Enter company name"
              name="companyName" required />
          </div>

          <div class="field-group full-width">
            <label class="field-label">Company Address <span class="required">*</span></label>
            <input type="text" class="field-input" placeholder="Enter company address"
              name="companyAddress" required />
          </div>

          <div class="field-group">
            <label class="field-label">Payment Year <span class="required">*</span></label>
            <input type="number" class="field-input" placeholder="e.g. 2024"
              name="paymentYear" required />
          </div>
          <div class="field-group">
            <label class="field-label">Payment Amount <span class="required">*</span></label>
            <input type="number" class="field-input" placeholder="e.g. 20,000/-"
              name="paymentAmount" required />
          </div>

          <div class="field-group">
            <label class="field-label">Upload Date <span class="required">*</span></label>
            <input type="date" class="field-input date-input"
              name="uploadDate" required />
          </div>

          <div class="field-group">
            <label class="field-label">Server Name</label>
            <input type="text" class="field-input" placeholder="Enter server name"
              name="serverName" />
          </div>

          <div class="field-group">
            <label class="field-label">MComp</label>
            <input type="text" class="field-input" placeholder="Enter MComp"
              name="mcomp" />
          </div>

          <div class="field-group">
            <label class="field-label">User Name</label>
            <input type="text" class="field-input" placeholder="Enter user name"
              name="userName" />
          </div>

          <div class="field-group">
            <label class="field-label">Password</label>
            <div class="field-wrap">
              <input type="password" class="field-input has-icon"
                placeholder="Enter password" name="password" id="password" />
              <button type="button" class="eye-toggle" id="toggle-password" aria-label="Toggle password">👁</button>
            </div>
          </div>

        </div><!-- /form-grid -->

        <!-- Buttons -->
        <div class="btn-row">
          <button type="button" class="btn-form btn-cancel" id="cancel-btn">
            Cancel
          </button>
          <button type="submit" class="btn-form btn-submit" id="submit-btn">
            <span class="btn-text">Submit Entry</span>
          </button>
          <button type="button" class="btn-form btn-update d-none" id="update-btn">
            <span class="btn-text">Update Entry</span>
          </button>
        </div>

      </form>
    </div><!-- /form-card -->

  </div>

  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/JS/FormScript/formScript.js"></script>
</body>
</html>
