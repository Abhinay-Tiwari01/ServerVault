<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ServerVault</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="../../Assets/PSMLOGO.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../Assets/PSMLOGO.PNG">
  <link rel="apple-touch-icon" href="../../Assets/PSMLOGO.PNG">
  <link rel="stylesheet" href="../../CSS/LoginCss/listOfUsers.css" />

</head>

<body>

  <!-- Ambient background (same as auth page) -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Center-burst entry shell — JS removes .entry-init after paint -->
  <div class="page-shell" id="pageShell">

    <!-- Top Navbar — original tag/class structure preserved -->
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
          <span class="brand-dot-sm">A</span>
          Admin Dashboard
        </span>
        <div class="d-flex align-items-center gap-3">
          <!-- <span class="navbar-brand mb-0 h1 users-title-badge">List of Users</span> -->
          <!-- ← add logout button -->
          <button class="btn btn-outline-danger btn-sm" onclick="logout()">
            Logout
          </button>
        </div>
      </div>
    </nav>


    <!-- Header Section — original structure & IDs preserved -->
    <header class="container header-section mb-4">
      <div class="row align-items-center">
        <div class="col-md-7 mb-2">
          <a class="btn btn-success me-2" href="../../FORMS/LoginPage/LoginAndCreatePage.html#register">
            + Add New User
          </a>
          <button class="btn btn-danger" onclick="deleteAllusers()">
            Delete All Users
          </button>
        </div>
        <div class="col-md-5 text-end">
          <input class="form-control" id="searchBox" placeholder="Type to search..." type="search"
            oninput="filterUsers()" />
        </div>
      </div>
    </header>

    <!-- Main Table — original tbody id preserved -->
    <main class="container">
      <div class="table-wrap">
        <table class="table table-striped table-dark table-bordered">
          <thead>
            <tr>
              <th style="width:8%">Sr No</th>
              <th>ID</th>
              <th>User Name</th>
              <th>Password</th>
              <th>Mobile No.</th>
              <th class="action_buttons" style="width:22%">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- filled by usersList.js -->
          </tbody>
        </table>

        <!-- Loading state -->
        <div class="table-loading" id="tableLoading">
          <div class="pulse-dot"></div>
          <div class="pulse-dot"></div>
          <div class="pulse-dot"></div>
        </div>

        <!-- Empty state -->
        <div class="table-empty" id="tableEmpty" style="display:none;">
          No users found.
        </div>
      </div>
    </main>

  </div><!-- /page-shell -->
  <!-- Auth check — must be before your other scripts -->
  <script src="../../js/auth.js"></script>
  <script src="../../JS/LoginScript/usersList.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdmin();
    });
  </script>
</body>

</html>
