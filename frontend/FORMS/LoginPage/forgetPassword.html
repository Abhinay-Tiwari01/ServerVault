<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ServerVault</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../CSS/LoginCss/forgetPasswordstyle.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="vh-100 d-flex justify-content-center align-items-center">

  <!-- Background grid + orbs (same as auth page) -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Slide-in card wrapper -->
  <div class="fp-wrapper" id="fpWrapper">
    <div class="col-md-6 col-lg-5">
      <div class="fp-card">

        <!-- Header -->
        <div class="fp-header">
          <div class="brand-mark">
            <div class="brand-dot">P</div>
            <span class="brand-name">PSM ServerVault</span>
          </div>
          <h3 class="fp-title">Reset Password</h3>
          <p class="fp-sub">Enter the registered mobile number to look up the account and set a new password.</p>
        </div>

        <!-- Form — all original IDs/names preserved -->
        <!-- <form id="updateForm" method="post" action="/findUserByMobile"> -->
        <form id="updateForm" onsubmit="return false;">

          <div class="field-group">
            <label for="usersMobile" class="field-label">Mobile Number</label>
            <input type="text" class="field-input" id="usersMobile" name="mobile"
              placeholder="Enter registered mobile no." required 
              oninput="fetchUserByMobile(this.value)"/>
          </div>

          <div class="field-group">
            <label for="username" class="field-label">Username (auto-filled)</label>
            <input type="text" class="field-input field-readonly" id="username"
              placeholder="Will appear after lookup" readonly />
          </div>

          <div class="field-group">
            <label for="password" class="field-label">New Password</label>
            <div class="field-wrap">
              <input type="password" class="field-input has-icon" id="password"
                name="newPassword" placeholder="Enter new password" />
              <button type="button" class="eye-toggle" id="toggle-fp-password" aria-label="Toggle password">👁</button>
            </div>
          </div>

          <!-- Hidden fields — preserved -->
          <input type="hidden" id="userId" name="userId" />
          <button type="submit" class="btn btn-info" hidden>Find User</button>

          <!-- Action buttons — original attributes kept, only styled -->
          <button class="btn-auth btn-primary-auth" type="button" onclick="updatePassword()" id="updateBtn">
            <span class="spinner-border spinner-border-sm d-none" id="updateSpinner" role="status"></span>
            <span class="btn-label">Update Password</span>
          </button>

          <a class="btn-auth btn-back-auth" href="../../FORMS/LoginPage/LoginAndCreatePage.html">← Back to Login</a>
        </form>

        <!-- Error box — original id preserved -->
        <div id="errorBox" class="feedback-box" style="display:none;"></div>
      </div>
    </div>
  </div>
  <!-- Auth check — must be before your other scripts -->
  <!-- <script src="/js/auth.js"></script> -->
  <script src="../../JS/LoginScript/updatePassword.js"></script>
</body>
</html>
